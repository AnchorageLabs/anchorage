name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Run typecheck
        run: pnpm -r typecheck

      - name: Run lint checks
        run: pnpm lint

      # NOT continue-on-error. It was, from the first version of this workflow
      # (#62, 2026-05-09) when there was almost nothing to fail — and it stayed
      # for three months, so a broken test could never turn a PR red. There are
      # now 278 assertions across eleven packages; advisory tests are worse than
      # no tests, because they are believed.
      - name: Run tests
        run: pnpm -r test

      - name: Run tests with coverage
        run: |
          cd sdk/typescript && pnpm test -- --coverage
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./sdk/typescript/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      # `|| true` made this unable to detect anything, and it was hiding a real
      # defect: the runner had no `--help`, so it printed usage and exited 2 —
      # every wrapper that shells out and asks for help saw a failure. Now that
      # `--help` exits 0, the smoke test can do its job: prove the built CLI
      # starts and responds.
      - name: CLI smoke test
        run: node cli/anchorage-runner/dist/index.js --help
